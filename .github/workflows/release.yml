name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install dependencies
        run: |
          npm run ci:install
          npx playwright install --with-deps chromium
      - name: Check tag and source
        if: github.ref_type == 'tag'
        run: npm run check:release-tag -- "${GITHUB_REF_NAME}"
      - name: Verify parser and bindings
        env:
          TREE_SITTER_FIXTURES_FETCH: always
        run: |
          npm run verify
          npm run test:fixtures
          npm run test:sanitizers
          npm run test:bindings:c
          npm run test:bindings:go
          npm run test:bindings:python
          npm run test:bindings:rust
          npm run test:bindings:java
          npm run test:bindings:zig
          npm run test:wasm
          npm run test:performance

  validate-swift:
    name: Validate Swift binding
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Swift binding
        run: |
          swift package clean --scratch-path build/bindings/swift
          swift test --scratch-path build/bindings/swift

  node-prebuilds:
    name: Node prebuild on ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Build the precompiled binding
        run: |
          npm run ci:install
          npm run package:node-prebuild
      - name: Upload the precompiled binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-${{ runner.os }}-${{ runner.arch }}
          path: prebuilds
          if-no-files-found: error
          retention-days: 3

  native-libraries:
    name: Native parser on ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Build native parser library
        env:
          TREE_SITTER_BUILD_DIR: build/native
        run: |
          npm run ci:install
          npm run build:native
      - name: Upload native parser library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: build/native/tree-sitter-logrotate.*
          if-no-files-found: error
          retention-days: 3

  python-wheels:
    name: Python wheel on ${{ matrix.os }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-14
            arch: arm64
          - os: windows-2025
            arch: AMD64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: .
          output-dir: wheelhouse
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ runner.os }}-${{ matrix.arch }}
          path: wheelhouse
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: Assemble and attest release
    needs: [validate, validate-swift, node-prebuilds, native-libraries, python-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Download Node prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-*
          path: prebuilds
          merge-multiple: true
      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: build/python-wheels
          merge-multiple: true
      - name: Download native parser libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: build/native-libraries
      - name: Build release artifacts
        run: |
          npm run ci:install
          python -m pip install --disable-pip-version-check --requirement requirements-build.txt
          npm run package:release -- --python-wheels build/python-wheels --native-libraries build/native-libraries
          npm run test:release
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
      - name: Locate release SBOM
        id: release-sbom
        run: node scripts/locate-release-sbom.mjs dist >> "$GITHUB_OUTPUT"
      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: dist/tree-sitter-logrotate-*-source.tar.gz
          sbom-path: ${{ steps.release-sbom.outputs.path }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish npm package
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/tree-sitter-logrotate
    permissions:
      contents: read
      id-token: write
    env:
      NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Publish first package version
        if: env.NPM_BOOTSTRAP_TOKEN != ''
        run: npm publish dist/tree-sitter-logrotate-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_BOOTSTRAP_TOKEN }}
      - name: Publish with trusted publishing
        if: env.NPM_BOOTSTRAP_TOKEN == ''
        run: npm publish dist/tree-sitter-logrotate-*.tgz --access public --provenance

  publish-pypi:
    name: Publish Python package
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-logrotate/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Select Python distributions
        run: |
          mkdir python-dist
          cp dist/tree_sitter_logrotate-*.whl python-dist/
          cp dist/tree_sitter_logrotate-*.tar.gz python-dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-dist
          attestations: true

  publish-crates:
    name: Publish Rust crate
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: crates-io
      url: https://crates.io/crates/tree-sitter-logrotate
    permissions:
      contents: read
      id-token: write
    env:
      CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Get a short-lived crates.io token
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish first crate version
        if: env.CRATES_IO_BOOTSTRAP_TOKEN != ''
        run: cargo publish --locked --token "${CRATES_IO_TOKEN}"
        env:
          CRATES_IO_TOKEN: ${{ env.CRATES_IO_BOOTSTRAP_TOKEN }}
      - name: Publish with trusted publishing
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        run: cargo publish --locked --token "${CRATES_IO_TOKEN}"
        env:
          CRATES_IO_TOKEN: ${{ steps.crates-auth.outputs.token }}

  publish-maven:
    name: Publish Java package
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.willibrandon/jtreesitter-logrotate
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Set up Java and Maven credentials
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Reproduce the attested Java artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          native_resources="$RUNNER_TEMP/java-resources"
          mkdir -p "$native_resources"
          unzip -q "dist/jtreesitter-logrotate-${version}.jar" 'META-INF/native/*' -d "$native_resources"
          mvn --batch-mode --no-transfer-progress \
            "-Dnative.resources.directory=${native_resources}" \
            -Dnative.test.runtime=false \
            -DskipTests=true \
            -Dgpg.skip=true \
            -Dpublish.skip=true \
            package
          cmp "dist/jtreesitter-logrotate-${version}.jar" "target/jtreesitter-logrotate-${version}.jar"
          cmp "dist/jtreesitter-logrotate-${version}-sources.jar" "target/jtreesitter-logrotate-${version}-sources.jar"
          cmp "dist/jtreesitter-logrotate-${version}-javadoc.jar" "target/jtreesitter-logrotate-${version}-javadoc.jar"
          cmp "dist/jtreesitter-logrotate-${version}.pom" pom.xml
      - name: Publish
        run: |
          mvn --batch-mode --no-transfer-progress \
            "-Dnative.resources.directory=${RUNNER_TEMP}/java-resources" \
            -Dnative.test.runtime=false \
            -DskipTests=true \
            -Dgpg.skip=false \
            -Dpublish.skip=false \
            -Dpublish.auto=true \
            deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [publish-npm, publish-pypi, publish-crates, publish-maven]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create release
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "tree-sitter-logrotate ${GITHUB_REF_NAME#v}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
