name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install dependencies
        run: |
          npm run ci:install
          npx playwright install --with-deps chromium
      - name: Check tag and source
        if: github.ref_type == 'tag'
        run: npm run check:release-tag -- "${GITHUB_REF_NAME}"
      - name: Verify parser and bindings
        env:
          TREE_SITTER_FIXTURES_FETCH: always
        run: |
          npm run verify
          npm run test:fixtures
          npm run test:sanitizers
          npm run test:bindings:c
          npm run test:bindings:go
          npm run test:bindings:python
          npm run test:bindings:rust
          npm run test:bindings:java
          npm run test:bindings:zig
          npm run test:wasm
          npm run test:performance

  validate-swift:
    name: Validate Swift binding
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Swift binding
        run: |
          swift package clean --scratch-path build/bindings/swift
          swift test --scratch-path build/bindings/swift

  validate-neovim:
    name: Validate Neovim and LazyVim installation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: nvim-linux-x86_64.tar.gz
            sha256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
            nvim: .ci/neovim-dist/nvim-linux-x86_64/bin/nvim
          - os: macos-14
            asset: nvim-macos-arm64.tar.gz
            sha256: 51ab83afa66d663627c2ab1be43209b0f4e81360d4598b53efaa4d8195f24c89
            nvim: .ci/neovim-dist/nvim-macos-arm64/bin/nvim
          - os: windows-2025
            asset: nvim-win64.zip
            sha256: 9fc3572829ffd13debb6e32555da2c8cc02555568260a9fc4cf1f65bbcca319c
            nvim: .ci/neovim-dist/nvim-win64/bin/nvim.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out nvim-treesitter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvim-treesitter/nvim-treesitter
          ref: a1bcffc8095c142ad1f7a9671a4ae180333f9209
          path: .ci/nvim-treesitter
          persist-credentials: false
      - name: Check out LazyVim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LazyVim/LazyVim
          ref: 459a4c3b1059671e766a46c7cc223827dc67e3d0
          path: .ci/LazyVim
          persist-credentials: false
      - name: Check out lazy.nvim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: folke/lazy.nvim
          ref: 85c7ff3711b730b4030d03144f6db6375044ae82
          path: .ci/lazy.nvim
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Install test dependencies
        run: npm run ci:install
      - name: Download stable Neovim
        shell: bash
        run: |
          mkdir -p .ci/neovim-dist
          curl --fail --location --silent --show-error \
            "https://github.com/neovim/neovim/releases/download/v0.12.4/${{ matrix.asset }}" \
            --output ".ci/neovim-dist/${{ matrix.asset }}"
          node scripts/check-file-sha256.mjs \
            ".ci/neovim-dist/${{ matrix.asset }}" \
            "${{ matrix.sha256 }}"
          cmake -E chdir .ci/neovim-dist \
            cmake -E tar xvf "${{ matrix.asset }}"
      - name: Test clean Neovim and LazyVim installations
        env:
          NVIM: ${{ matrix.nvim }}
          NVIM_TREESITTER_SOURCE: ${{ github.workspace }}/.ci/nvim-treesitter
          LAZY_NVIM_SOURCE: ${{ github.workspace }}/.ci/lazy.nvim
          LAZYVIM_SOURCE: ${{ github.workspace }}/.ci/LazyVim
        run: npm run test:neovim:install

  node-prebuilds:
    name: Node prebuild on ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2025
          - windows-11-vs2026-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Build the precompiled binding
        run: |
          npm run ci:install
          npm run package:node-prebuild
      - name: Upload the precompiled binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-${{ runner.os }}-${{ runner.arch }}
          path: prebuilds
          if-no-files-found: error
          retention-days: 3

  native-libraries:
    name: Native parser on ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2025
          - windows-11-vs2026-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Build native parser library
        env:
          TREE_SITTER_BUILD_DIR: build/native
        run: |
          npm run ci:install
          npm run build:native
      - name: Upload native parser library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: build/native/tree-sitter-logrotate.*
          if-no-files-found: error
          retention-days: 3

  python-wheels:
    name: Python wheel on ${{ matrix.os }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-14
            arch: arm64
          - os: windows-2025
            arch: AMD64
          - os: windows-11-vs2026-arm
            arch: ARM64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: .
          output-dir: wheelhouse
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ runner.os }}-${{ matrix.arch }}
          path: wheelhouse
          if-no-files-found: error
          retention-days: 3

  release-platforms:
    name: Required release artifact runners
    needs: [node-prebuilds, native-libraries, python-wheels]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release artifact runner
        env:
          NODE_RESULT: ${{ needs.node-prebuilds.result }}
          NATIVE_RESULT: ${{ needs.native-libraries.result }}
          PYTHON_RESULT: ${{ needs.python-wheels.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$PYTHON_RESULT" = success

  assemble:
    name: Assemble and attest release
    needs: [validate, validate-swift, validate-neovim, release-platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Download Node prebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-*
          path: prebuilds
          merge-multiple: true
      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: build/python-wheels
          merge-multiple: true
      - name: Download native parser libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: build/native-libraries
      - name: Build release artifacts
        run: |
          npm run ci:install
          python -m pip install --disable-pip-version-check --requirement requirements-build.txt
          npm run package:release -- --python-wheels build/python-wheels --native-libraries build/native-libraries
          npm run test:release
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Locate release SBOM
        id: release-sbom
        run: node scripts/locate-release-sbom.mjs dist >> "$GITHUB_OUTPUT"
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/tree-sitter-logrotate-*-source.tar.gz
          sbom-path: ${{ steps.release-sbom.outputs.path }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish npm package
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/tree-sitter-logrotate
    permissions:
      contents: read
      id-token: write
    env:
      NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the pinned npm version
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Publish first package version
        if: env.NPM_BOOTSTRAP_TOKEN != ''
        run: npm publish ./dist/tree-sitter-logrotate-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_BOOTSTRAP_TOKEN }}
      - name: Publish with trusted publishing
        if: env.NPM_BOOTSTRAP_TOKEN == ''
        run: npm publish ./dist/tree-sitter-logrotate-*.tgz --access public --provenance

  publish-pypi:
    name: Publish Python package
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-logrotate/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Select Python distributions
        run: |
          mkdir python-dist
          cp dist/tree_sitter_logrotate-*.whl python-dist/
          cp dist/tree_sitter_logrotate-*.tar.gz python-dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-dist
          attestations: true

  publish-crates:
    name: Publish Rust crate
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: crates-io
      url: https://crates.io/crates/tree-sitter-logrotate
    permissions:
      contents: read
      id-token: write
    env:
      CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
      - name: Get a short-lived crates.io token
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish first crate version
        if: env.CRATES_IO_BOOTSTRAP_TOKEN != ''
        run: cargo publish --locked --token "${CRATES_IO_TOKEN}"
        env:
          CRATES_IO_TOKEN: ${{ env.CRATES_IO_BOOTSTRAP_TOKEN }}
      - name: Publish with trusted publishing
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        run: cargo publish --locked --token "${CRATES_IO_TOKEN}"
        env:
          CRATES_IO_TOKEN: ${{ steps.crates-auth.outputs.token }}

  publish-maven:
    name: Publish Java package
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.willibrandon/jtreesitter-logrotate
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Set up Java and Maven credentials
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Reproduce the attested Java artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          native_resources="$RUNNER_TEMP/java-resources"
          mkdir -p "$native_resources"
          unzip -q "dist/jtreesitter-logrotate-${version}.jar" 'META-INF/native/*' -d "$native_resources"
          mvn --batch-mode --no-transfer-progress \
            "-Dnative.resources.directory=${native_resources}" \
            -Dnative.test.runtime=false \
            -DskipTests=true \
            -Dgpg.skip=true \
            -Dpublish.skip=true \
            package
          cmp "dist/jtreesitter-logrotate-${version}.jar" "target/jtreesitter-logrotate-${version}.jar"
          cmp "dist/jtreesitter-logrotate-${version}-sources.jar" "target/jtreesitter-logrotate-${version}-sources.jar"
          cmp "dist/jtreesitter-logrotate-${version}-javadoc.jar" "target/jtreesitter-logrotate-${version}-javadoc.jar"
          cmp "dist/jtreesitter-logrotate-${version}.pom" pom.xml
      - name: Publish
        run: |
          mvn --batch-mode --no-transfer-progress \
            "-Dnative.resources.directory=${RUNNER_TEMP}/java-resources" \
            -Dnative.test.runtime=false \
            -DskipTests=true \
            -Dgpg.skip=false \
            -Dpublish.skip=false \
            -Dpublish.auto=true \
            deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [publish-npm, publish-pypi, publish-crates, publish-maven]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Create release
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --title "tree-sitter-logrotate ${GITHUB_REF_NAME#v}"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
