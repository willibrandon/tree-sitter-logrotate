name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2025
          - windows-11-vs2026-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm run ci:install
      - name: Check toolchain and generated sources
        run: |
          npm run check:versions
          npm run check:generated
          git diff --exit-code
      - name: Run tests
        run: npm test
      - name: Build Node precompiled binding
        run: npm run package:node-prebuild
      - name: Build native and WASM parsers
        run: |
          npm run build:native
          npm run test:bindings:c
          npm run build:wasm
          npm run test:wasm:node

  fixtures:
    name: Pinned upstream fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Classify pinned logrotate and VS Code fixtures
        env:
          TREE_SITTER_FIXTURES_FETCH: always
        run: |
          npm run ci:install
          npm run test:fixtures

  wasm-browser:
    name: Chromium WASM host
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm run ci:install
          npx playwright install --with-deps chromium
      - name: Test the browser WASM package
        run: npm run test:wasm

  neovim:
    name: Neovim ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable-0.12.4-linux
            os: ubuntu-24.04
            revision: 68ea43cd0c28af25cd47731308c94fedfcfd1b0b
            nvim: .ci/neovim-dist/nvim/bin/nvim
          - channel: development-linux
            os: ubuntu-24.04
            revision: 1c9002a70ebcc77ddec169d779fea6f64ccf755a
            nvim: .ci/neovim-dist/nvim/bin/nvim
          - channel: stable-0.12.4-macos-arm64
            os: macos-14
            asset: nvim-macos-arm64.tar.gz
            sha256: 51ab83afa66d663627c2ab1be43209b0f4e81360d4598b53efaa4d8195f24c89
            nvim: .ci/neovim-dist/nvim-macos-arm64/bin/nvim
          - channel: stable-0.12.4-windows-x64
            os: windows-2025
            asset: nvim-win64.zip
            sha256: 9fc3572829ffd13debb6e32555da2c8cc02555568260a9fc4cf1f65bbcca319c
            nvim: .ci/neovim-dist/nvim-win64/bin/nvim.exe
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Neovim
        if: matrix.revision != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: neovim/neovim
          ref: ${{ matrix.revision }}
          path: .ci/neovim
          persist-credentials: false
      - name: Check out Bash grammar
        if: matrix.revision != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tree-sitter/tree-sitter-bash
          ref: a06c2e4415e9bc0346c6b86d401879ffb44058f7
          path: .ci/tree-sitter-bash
          persist-credentials: false
      - name: Check out nvim-treesitter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvim-treesitter/nvim-treesitter
          ref: a1bcffc8095c142ad1f7a9671a4ae180333f9209
          path: .ci/nvim-treesitter
          persist-credentials: false
      - name: Check out LazyVim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LazyVim/LazyVim
          ref: 459a4c3b1059671e766a46c7cc223827dc67e3d0
          path: .ci/LazyVim
          persist-credentials: false
      - name: Check out lazy.nvim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: folke/lazy.nvim
          ref: 85c7ff3711b730b4030d03144f6db6375044ae82
          path: .ci/lazy.nvim
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm run ci:install
      - name: Download stable Neovim
        if: matrix.asset != ''
        shell: bash
        run: |
          mkdir -p .ci/neovim-dist
          curl --fail --location --silent --show-error \
            "https://github.com/neovim/neovim/releases/download/v0.12.4/${{ matrix.asset }}" \
            --output ".ci/neovim-dist/${{ matrix.asset }}"
          node scripts/check-file-sha256.mjs \
            ".ci/neovim-dist/${{ matrix.asset }}" \
            "${{ matrix.sha256 }}"
          cmake -E chdir .ci/neovim-dist \
            cmake -E tar xvf "${{ matrix.asset }}"
      - name: Build development test dependencies
        if: matrix.revision != ''
        shell: bash
        run: |
          make -C .ci/neovim CMAKE_BUILD_TYPE=RelWithDebInfo CMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.ci/neovim-dist/nvim" install
          mkdir -p "$GITHUB_WORKSPACE/.ci/tree-sitter-bash-runtime/parser"
          npm exec -- tree-sitter build \
            --output "$GITHUB_WORKSPACE/.ci/tree-sitter-bash-runtime/parser/bash.so" \
            .ci/tree-sitter-bash
      - name: Test the direct Neovim runtime
        if: matrix.revision != ''
        env:
          NVIM: ${{ matrix.nvim }}
          NVIM_TREESITTER_RUNTIME: ${{ github.workspace }}/.ci/nvim-treesitter
          XDG_DATA_DIRS: ${{ github.workspace }}/.ci/tree-sitter-bash-runtime
        run: npm run test:neovim
      - name: Test clean Neovim and LazyVim installations
        env:
          NVIM: ${{ matrix.nvim }}
          NVIM_TREESITTER_SOURCE: ${{ github.workspace }}/.ci/nvim-treesitter
          LAZY_NVIM_SOURCE: ${{ github.workspace }}/.ci/lazy.nvim
          LAZYVIM_SOURCE: ${{ github.workspace }}/.ci/LazyVim
        run: npm run test:neovim:install

  tree-sitter-cli:
    name: Tree-sitter CLI ${{ matrix.tree-sitter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tree-sitter: ["0.26.3", "0.26.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Test the committed parser with Tree-sitter ${{ matrix.tree-sitter }}
        env:
          TREE_SITTER_VERSION: ${{ matrix.tree-sitter }}
        run: |
          npm run ci:install
          npm exec --yes --allow-scripts=tree-sitter-cli --package="tree-sitter-cli@${TREE_SITTER_VERSION}" -- tree-sitter --version
          npm exec --yes --allow-scripts=tree-sitter-cli --package="tree-sitter-cli@${TREE_SITTER_VERSION}" -- tree-sitter test --grammar-path .
          npm exec --yes --allow-scripts=tree-sitter-cli --package="tree-sitter-cli@${TREE_SITTER_VERSION}" -- tree-sitter test --grammar-path src/state

  upstream-parser:
    name: Upstream Tree-sitter parser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Tree-sitter CLI
        uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086 # v2
        with:
          tree-sitter-ref: v0.26.12
      - name: Run upstream parser checks
        uses: tree-sitter/parser-test-action@05f6ce7c7e54603c45cd87ed926725dc870bcc63 # v3
        with:
          abi-version: "15"
          test-parser-cmd: tree-sitter test --grammar-path . && tree-sitter test --grammar-path src/state

  query-validation:
    name: Tree-sitter query validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Tree-sitter CLI
        uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086 # v2
        with:
          tree-sitter-ref: v0.26.12
      - name: Install ts_query_ls
        shell: bash
        env:
          TS_QUERY_LS_SHA256: 35859176141c3ebaac231000fd96d50a14c6bc26963f0a1662aac33f656d443d
          TS_QUERY_LS_URL: https://github.com/ribru17/ts_query_ls/releases/download/v3.16.0/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz
        run: |
          archive="$RUNNER_TEMP/ts_query_ls.tar.gz"
          directory="$RUNNER_TEMP/ts_query_ls"
          curl --fail --location --silent --show-error "$TS_QUERY_LS_URL" --output "$archive"
          printf '%s  %s\n' "$TS_QUERY_LS_SHA256" "$archive" | sha256sum --check
          mkdir "$directory"
          tar --extract --gzip --file "$archive" --directory "$directory"
      - name: Validate queries
        shell: bash
        run: |
          tree-sitter build --output "$RUNNER_TEMP/tree-sitter-logrotate.so" .
          tree-sitter build --output "$RUNNER_TEMP/tree-sitter-logrotate_state.so" src/state
          "$RUNNER_TEMP/ts_query_ls/ts_query_ls" check --format \
            --config "{\"parser_install_directories\":[\"$RUNNER_TEMP\"]}" \
            queries/

  go:
    name: Go ${{ matrix.go }} binding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "1.26.5"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test the Go binding
        run: go test ./bindings/go

  python:
    name: Python ${{ matrix.python }} binding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Test the Python binding
        env:
          PYTHON: python
        run: |
          npm run ci:install
          npm run test:bindings:python

  rust:
    name: Rust ${{ matrix.rust }} binding
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "1.97.1"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test the Rust binding
        run: npm run test:bindings:rust

  swift:
    name: Swift binding on macOS arm64
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Swift binding
        run: |
          swift package clean --scratch-path build/bindings/swift
          swift test --scratch-path build/bindings/swift

  zig:
    name: Zig 0.16.0 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Test the Zig binding
        run: zig build test --cache-dir build/bindings/zig/cache --global-cache-dir build/bindings/zig/global-cache

  java:
    name: Java 25 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: |
          npm run ci:install
          mvn --batch-mode --no-transfer-progress clean test

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build and run sanitizer smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          npm run ci:install
          npm run test:sanitizers

  performance:
    name: Performance and artifact budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Measure parser performance
        run: |
          npm run ci:install
          npm run test:performance
      - name: Upload measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-performance-linux-x64
          path: build/performance/results.json
          if-no-files-found: error

  required:
    name: Required CI
    needs:
      - build
      - fixtures
      - wasm-browser
      - neovim
      - tree-sitter-cli
      - upstream-parser
      - query-validation
      - go
      - python
      - rust
      - swift
      - zig
      - java
      - sanitizers
      - performance
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test runner
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          WASM_BROWSER_RESULT: ${{ needs['wasm-browser'].result }}
          NEOVIM_RESULT: ${{ needs.neovim.result }}
          TREE_SITTER_CLI_RESULT: ${{ needs['tree-sitter-cli'].result }}
          UPSTREAM_PARSER_RESULT: ${{ needs['upstream-parser'].result }}
          QUERY_VALIDATION_RESULT: ${{ needs['query-validation'].result }}
          GO_RESULT: ${{ needs.go.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
          ZIG_RESULT: ${{ needs.zig.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          for result in \
            "$BUILD_RESULT" \
            "$FIXTURES_RESULT" \
            "$WASM_BROWSER_RESULT" \
            "$NEOVIM_RESULT" \
            "$TREE_SITTER_CLI_RESULT" \
            "$UPSTREAM_PARSER_RESULT" \
            "$QUERY_VALIDATION_RESULT" \
            "$GO_RESULT" \
            "$PYTHON_RESULT" \
            "$RUST_RESULT" \
            "$SWIFT_RESULT" \
            "$ZIG_RESULT" \
            "$JAVA_RESULT" \
            "$SANITIZERS_RESULT" \
            "$PERFORMANCE_RESULT"
          do
            test "$result" = success
          done
