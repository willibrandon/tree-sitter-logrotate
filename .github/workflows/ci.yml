name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
          - windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies
        run: npm run ci:install
      - name: Check toolchain and generated sources
        run: |
          npm run check:versions
          npm run check:generated
          git diff --exit-code
      - name: Run tests
        run: npm test
      - name: Build native and WASM parsers
        run: |
          npm run build:native
          npm run build:wasm

  java:
    name: Java 25 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: |
          npm run ci:install
          mvn --batch-mode --no-transfer-progress clean test

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Build and run sanitizer smoke test
        shell: bash
        run: |
          npm run ci:install
          mkdir -p build/sanitizers
          clang -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -D_DEFAULT_SOURCE -D_POSIX_C_SOURCE=200112L \
            -I node_modules/tree-sitter/vendor/tree-sitter/lib/include \
            -I node_modules/tree-sitter/vendor/tree-sitter/lib/src \
            scripts/sanitizer-smoke.c \
            src/parser.c \
            node_modules/tree-sitter/vendor/tree-sitter/lib/src/lib.c \
            -o build/sanitizers/parser-smoke
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            build/sanitizers/parser-smoke
