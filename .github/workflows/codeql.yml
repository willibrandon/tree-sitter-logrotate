name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build hand-written scanner for analysis
        if: ${{ matrix.build-mode == 'manual' }}
        run: |
          mkdir -p "$RUNNER_TEMP/codeql"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Isrc \
            -c src/scanner.c -o "$RUNNER_TEMP/codeql/scanner.o"
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
