name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository
        uses: willibrandon/picket@cb6cbae0f5c9d35e75642e9ded88a3edaa8d12c8 # v0.2.11
        with:
          cache: false
          fail-on: findings
          redact: 100
