name: Recover npm release

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Failed release workflow run containing the attested artifacts
        required: true
        type: string
      tag:
        description: Existing release tag produced by that run
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish the verified npm artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/tree-sitter-logrotate
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RECOVERY_TAG: ${{ inputs.tag }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the pinned npm version
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = "12.0.2"
      - name: Validate the failed release run and tag
        id: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          release_sha="$(jq -r '.head_sha' <<< "$release")"
          test "$(jq -r '.head_branch' <<< "$release")" = "$RECOVERY_TAG"
          test "$(jq -r '.event' <<< "$release")" = "push"
          test "$(jq -r '.path' <<< "$release")" = ".github/workflows/release.yml"
          test "$(jq -r '.status' <<< "$release")" = "completed"
          test "$(jq -r '.conclusion' <<< "$release")" = "failure"
          test "$(git cat-file -t "$RECOVERY_TAG")" = "tag"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "$(git rev-parse "${RECOVERY_TAG}^{commit}")" = "$release_sha"
          npm run check:release-tag -- "$RECOVERY_TAG"
          assemble_conclusion="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Assemble and attest release") | .conclusion] | if length == 1 then .[0] else "invalid" end'
          )"
          test "$assemble_conclusion" = "success"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Download the attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the npm artifact
        env:
          SOURCE_SHA: ${{ steps.release-source.outputs.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          shopt -s nullglob
          tarballs=(./dist/tree-sitter-logrotate-*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          expected_version="${RECOVERY_TAG#v}"
          tar -xOf "$tarball" package/package.json > "$RUNNER_TEMP/npm-package.json"
          node -e '
            const manifest = require(process.argv[1]);
            if (manifest.name !== "tree-sitter-logrotate" || manifest.version !== process.argv[2]) process.exit(1);
          ' "$RUNNER_TEMP/npm-package.json" "$expected_version"
          gh attestation verify "$tarball" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
            --source-ref "refs/tags/${RECOVERY_TAG}" \
            --source-digest "${SOURCE_SHA}" \
            --deny-self-hosted-runners
      - name: Publish the npm artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          shopt -s nullglob
          tarballs=(./dist/tree-sitter-logrotate-*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          version="${RECOVERY_TAG#v}"
          local_integrity="$(
            node -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
            ' "$tarball"
          )"
          if npm view "tree-sitter-logrotate@${version}" dist.integrity --json > "$RUNNER_TEMP/npm-integrity.json" 2>/dev/null; then
            published_integrity="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")))' "$RUNNER_TEMP/npm-integrity.json")"
            test "$published_integrity" = "$local_integrity"
            echo "tree-sitter-logrotate@${version} already has the expected artifact."
          else
            npm publish "$tarball" --access public --provenance
          fi
