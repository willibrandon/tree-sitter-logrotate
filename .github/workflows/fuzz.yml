name: Parser fuzzing

on:
  pull_request:
    paths:
      - grammar.js
      - src/scanner.c
      - test/corpus/**
      - package.json
      - package-lock.json
  schedule:
    - cron: "41 8 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Fuzz parser and external scanner
        run: |
          npm run ci:install
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npm run test:fuzz:pr
          else
            npm run test:fuzz
          fi
      - name: Upload fuzz transcript and failing edits
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logrotate-fuzz-reproduction-${{ github.run_id }}
          path: build/fuzz
          if-no-files-found: error
          retention-days: 30
