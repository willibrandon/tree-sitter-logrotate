name: Parser fuzzing

on:
  pull_request:
    paths:
      - grammar.js
      - src/scanner.c
      - test/corpus/**
      - package.json
      - package-lock.json
  schedule:
    - cron: "41 8 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-fuzz:
    name: Upstream Tree-sitter fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzz with the upstream action
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        with:
          max-time: ${{ github.event_name == 'pull_request' && 120 || 600 }}

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Fuzz parser and external scanner
        run: |
          npm run ci:install
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npm run test:fuzz:pr
          else
            npm run test:fuzz
          fi
      - name: Upload fuzz transcript and failing edits
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logrotate-fuzz-reproduction-${{ github.run_id }}
          path: build/fuzz
          if-no-files-found: error
          retention-days: 30
