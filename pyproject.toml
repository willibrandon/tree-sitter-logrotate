[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-logrotate"
description = "Logrotate configuration and state grammars for Tree-sitter"
version = "0.2.0"
keywords = ["incremental", "parsing", "tree-sitter", "logrotate"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Brandon Williams" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Homepage = "https://willibrandon.github.io/tree-sitter-logrotate/"
Documentation = "https://willibrandon.github.io/tree-sitter-logrotate/"
Source = "https://github.com/willibrandon/tree-sitter-logrotate"
Issues = "https://github.com/willibrandon/tree-sitter-logrotate/issues"

[project.optional-dependencies]
core = ["tree-sitter~=0.26"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
test-requires = ["tree-sitter==0.26.0"]
test-command = "python {project}/scripts/test-python-package.py"
